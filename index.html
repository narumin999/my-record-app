<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ記録アプリ</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4285f4">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>マイ記録アプリ</header>
    <div class="container">
        <div id="login-screen">
            <h3>Googleアカウントでログイン</h3>
            <p style="font-size: 14px; color: #666; margin-bottom: 20px;">ボタンを押してアプリを開始してください</p>
            <button class="btn" onclick="handleAuthClick()">ログインして開始</button>
        </div>

        <div id="main-app" style="display: none;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('create')">記録する</button>
                <button class="tab-btn" onclick="switchTab('view')">履歴一覧</button>
            </div>

            <div id="tab-create" class="tab-content active">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 id="form-mode-title" style="margin:0 0 10px 0; font-size:16px; color:#4285f4;">新規作成モード</h3>
                    <button class="btn btn-secondary" style="width:auto; padding:4px 10px; font-size:12px; margin:0;" onclick="resetForm()">新規作成に切り替え</button>
                </div>

                <label>分類</label>
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
                    <select id="input-category" style="margin-top: 0; margin-bottom: 0; flex: 1;" onchange="onCategoryChange()"></select>
                    <button type="button" class="btn btn-secondary" style="width: auto; margin: 0; padding: 10px;" onclick="openCategoryModal()">⚙️ 追加・編集</button>
                </div>

                <label>タイトル</label>
                <input type="text" id="input-title" placeholder="例: Hakuba旅行 1日目">
                
                <label>日時</label>
                <div style="margin-top:4px;">
                    <input type="checkbox" id="is-allday" checked onchange="toggleDateTime()"> <label for="is-allday" style="display:inline; font-weight:normal;">終日</label>
                </div>
                <div id="date-inputs">
                    <input type="date" id="input-date">
                </div>
                <div id="datetime-inputs" style="display:none;">
                    <div class="datetime-group">開始: <input type="datetime-local" id="input-start-datetime"></div>
                    <div class="datetime-group">終了: <input type="datetime-local" id="input-end-datetime"></div>
                </div>

                <label>場所 (Googleマップ連動サジェスト)</label>
                <input type="text" id="input-location" placeholder="場所名や施設名を入力すると候補が出ます">

                <label>カレンダーの色</label>
                <div class="color-palette" id="color-palette"></div>

                <label style="margin-top: 16px;">記録内容</label>
                <div class="editor-toolbar">
                    <button type="button" title="太字" onclick="formatText('b')"><b>B</b></button>
                    <button type="button" title="斜体" onclick="formatText('i')"><i>I</i></button>
                    <button type="button" title="下線" onclick="formatText('u')"><u>U</u></button>
                    <button type="button" title="取り消し線" onclick="formatText('s')"><s>S</s></button>
                    <button type="button" title="箇条書きリスト" onclick="formatText('ul')">📋 箇条書き</button>
                    <button type="button" title="番号付きリスト" onclick="formatText('ol')">🔢 番号付き</button>
                    <button type="button" title="リンク挿入" onclick="formatText('a')">🔗 リンク</button>
                    <button type="button" title="書式のクリア" onclick="formatText('clear')">🧹 クリア</button>
                </div>
                <textarea id="input-text" placeholder="今日の出来事を記録..."></textarea>
                
                <label>添付ファイル (写真・動画・文書など 複数可)</label>
                <input type="file" id="file-upload" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt" style="display: none;" onchange="processFiles(event)">
                <button class="btn" style="background:#34a853; margin-top:4px;" onclick="document.getElementById('file-upload').click()">ファイルを選ぶ</button>
                <div id="selected-files-preview" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;"></div>
                
                <div id="status-msg"></div>
                
                <button class="btn" style="margin-top: 20px;" onclick="saveRecord()">
                    <span id="save-btn-text">保存 (Drive連携 & カレンダー登録)</span>
                </button>
                
                <!-- ▼ 3つのボタンが横並びになるように修正 ▼ -->
                <div style="display:flex; gap:10px; margin-top: 10px;">
                    <button id="sns-btn" class="btn" style="display: none; flex: 1; background-color: #E1306C; color: white;" onclick="shareToSNS()">📱 SNSシェア</button>
                    <button id="share-btn" class="btn" style="display: none; flex: 1; background-color: #f4b400; color: white;" onclick="openShareModal()">🌐 ゲスト公開</button>
                    <button id="delete-btn" class="btn btn-danger" style="display: none; flex: 1;" onclick="deleteCurrentRecord()">🗑️ 削除</button>
                </div>
            </div>
            
            <div id="tab-view" class="tab-content">
                <button class="btn" onclick="loadRecordsList()">再読み込み</button>
                <div id="record-list" style="margin-top: 16px;"></div>
            </div>
        </div>
    </div>

    <!-- 分類管理モーダル -->
    <div id="category-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">分類の追加・編集</h3>
            <div id="category-list" style="margin-bottom: 16px;"></div>
            <hr style="margin: 16px 0; border: none; border-top: 1px solid #ddd;">
            <h4 style="margin:0 0 8px 0;">新しい分類を追加</h4>
            <input type="text" id="new-cat-name" placeholder="分類名を入力">
            <label style="margin-top: 12px;">紐づける色</label>
            <div class="color-palette" id="modal-color-palette"></div>
            <div id="modal-status-msg" style="margin-top:10px; font-size:14px; font-weight:bold; text-align:center;"></div>
            <div style="display:flex; gap:10px; margin-top: 20px;">
                <button class="btn" style="margin:0;" onclick="addCategory()">追加して保存</button>
                <button class="btn btn-secondary" style="margin:0;" onclick="closeCategoryModal()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- ゲスト公開モーダル -->
    <div id="share-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#f4b400;">🌐 ゲストに公開</h3>
            <p style="font-size: 14px; color: #666;">入力したメールアドレスのユーザーをカレンダーのゲストに招待し、この記録専用の閲覧権限を付与します。</p>
            <label>ゲストのメールアドレス</label>
            <input type="email" id="guest-email" placeholder="例: guest@example.com (複数はカンマ区切り)">
            
            <div id="share-status-msg" style="margin-top:10px; font-size:14px; font-weight:bold; text-align:center;"></div>
            
            <div style="display:flex; gap:10px; margin-top: 20px;">
                <button class="btn" style="margin:0; background:#f4b400;" onclick="publishRecord()">公開して招待状を送る</button>
                <button class="btn btn-secondary" style="margin:0;" onclick="closeShareModal()">キャンセル</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/drive.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
